      <circle cx="86" cy="98" r="8" fill="#000"/>
      <path d="M86 40v48" stroke="#000" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
      <rect x="44" y="42" width="12" height="42" rx="2" fill="#000"/>
      <rect x="33" y="52" width="34" height="10" rx="2" fill="#000"/>
      <rect x="50" y="75" width="18" height="10" rx="2" fill="#000"/>
