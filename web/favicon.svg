<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Le billet perforé de « Ce soir », sur le fond sombre de l'app. Formes seules, sans
       texte : l'icône doit rester la même sans police chargée, à 16 px comme à 128 px. -->
  <defs>
    <mask id="perforation">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="86" cy="30" r="8" fill="#000"/>
      <circle cx="86" cy="98" r="8" fill="#000"/>
    </mask>
  </defs>
  <rect width="128" height="128" rx="26" fill="#14111a"/>
  <g mask="url(#perforation)">
    <rect x="14" y="30" width="100" height="68" rx="8" fill="#f2a93b"/>
  </g>
  <path d="M86 40v48" stroke="#14111a" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <!-- un « t » -->
  <rect x="44" y="42" width="12" height="42" rx="2" fill="#14111a"/>
  <rect x="33" y="52" width="34" height="10" rx="2" fill="#14111a"/>
  <rect x="50" y="75" width="18" height="10" rx="2" fill="#14111a"/>
</svg>
